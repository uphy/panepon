<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibrate test</title>
<style>
  body { font-family: sans-serif; background: #14141c; color: #eee; margin: 0; padding: 24px; }
  button { display: block; width: 100%; font-size: 22px; padding: 24px; margin: 12px 0; border-radius: 12px; border: none; background: #3b62e0; color: #fff; }
  pre { background: #222; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>navigator.vibrate test</h1>
<p>Phaser やゲームのコードを通さず、ボタンの click ハンドラから直接 navigator.vibrate() を呼ぶ。</p>
<button id="b1">vibrate(300)</button>
<button id="b2">vibrate([100, 50, 100, 50, 300])</button>
<button id="b3">vibrate(1000)</button>
<pre id="log"></pre>
<script>
  const log = document.getElementById("log");
  const write = (m) => { log.textContent = new Date().toLocaleTimeString() + " " + m + "\n" + log.textContent; };
  write("typeof navigator.vibrate = " + typeof navigator.vibrate);
  write("standalone = " + (window.matchMedia("(display-mode: standalone)").matches));
  write("UA = " + navigator.userAgent);
  const run = (p) => () => {
    try {
      const r = navigator.vibrate(p);
      write("vibrate(" + JSON.stringify(p) + ") -> " + r);
    } catch (e) {
      write("vibrate threw: " + e);
    }
  };
  document.getElementById("b1").addEventListener("click", run(300));
  document.getElementById("b2").addEventListener("click", run([100, 50, 100, 50, 300]));
  document.getElementById("b3").addEventListener("click", run(1000));
</script>
</body>
</html>
